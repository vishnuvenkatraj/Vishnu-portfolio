<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1c" />
      <stop offset="50%" stop-color="#0e1a33" />
      <stop offset="100%" stop-color="#060914" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- Outer Certificate Border -->
  <rect x="30" y="30" width="1140" height="740" rx="16" fill="none" stroke="#eab308" stroke-width="2" stroke-opacity="0.4" />
  <rect x="42" y="42" width="1116" height="716" rx="12" fill="none" stroke="#eab308" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="8 6" />

  <!-- Corner Geometric Ornaments -->
  <path d="M42 90 L42 42 L90 42" fill="none" stroke="#eab308" stroke-width="3" />
  <path d="M1158 90 L1158 42 L1110 42" fill="none" stroke="#eab308" stroke-width="3" />
  <path d="M42 710 L42 758 L90 758" fill="none" stroke="#eab308" stroke-width="3" />
  <path d="M1158 710 L1158 758 L1110 758" fill="none" stroke="#eab308" stroke-width="3" />

  <!-- Decorative Guilloche Wave Accent -->
  <path d="M100 120 Q 300 80, 600 120 T 1100 120" fill="none" stroke="#eab308" stroke-width="1" stroke-opacity="0.15" />
  <path d="M100 680 Q 300 720, 600 680 T 1100 680" fill="none" stroke="#eab308" stroke-width="1" stroke-opacity="0.15" />

  <!-- Certificate Category Badge -->
  <rect x="450" y="70" width="300" height="34" rx="17" fill="#eab308" fill-opacity="0.12" stroke="#eab308" stroke-width="1" stroke-opacity="0.5" />
  <text x="600" y="92" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#eab308" letter-spacing="3">ELITE + GOLD CERTIFICATION</text>

  <!-- Issuer / Organization -->
  <text x="600" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" letter-spacing="4">NPTEL & IIT CERTIFICATION</text>

  <!-- Main Award / Competition Title -->
  <text x="600" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1">NPTEL — Human Computer Interaction (12 Weeks)</text>

  <!-- Presentation Formula -->
  <text x="600" y="300" text-anchor="middle" font-family="'Georgia', serif" font-style="italic" font-size="18" fill="#64748b">This credential is proudly conferred upon</text>

  <!-- Recipient Name -->
  <text x="600" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="url(#primaryGrad)" filter="url(#glow)" letter-spacing="4">VISHNU V</text>
  <line x1="350" y1="405" x2="850" y2="405" stroke="#eab308" stroke-width="2" stroke-opacity="0.4" />

  <!-- Description -->
  <foreignObject x="220" y="430" width="760" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: system-ui, sans-serif; font-size: 16px; color: #cbd5e1; text-align: center; line-height: 1.6; font-weight: 300;">
      Successfully completed the 12-week advanced course in Human Computer Interaction, demonstrating mastery of user interface ergonomics, interaction models, and usability engineering.
    </div>
  </foreignObject>

  
  <!-- Score Badge -->
  <rect x="500" y="550" width="200" height="42" rx="21" fill="url(#goldGrad)" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5" />
  <text x="600" y="577" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#fbbf24">FINAL SCORE: 95%</text>
  

  <!-- Footer Elements: Date, Seal Stamp, Verified Badge -->
  <!-- Left: Date -->
  <text x="180" y="670" font-family="'Courier New', monospace" font-size="13" fill="#64748b" letter-spacing="1">ISSUED DATE</text>
  <text x="180" y="695" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0">12-Week Comprehensive Course</text>
  <line x1="180" y1="710" x2="320" y2="710" stroke="#334155" stroke-width="1" />

  <!-- Center: Golden Seal Stamp -->
  <g transform="translate(600, 680)">
    <circle r="42" fill="#eab308" fill-opacity="0.1" stroke="#eab308" stroke-width="2" />
    <circle r="36" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="4 3" />
    <polygon points="0,-22 7,-7 22,-7 11,3 15,18 0,9 -15,18 -11,3 -22,-7 -7,-7" fill="#eab308" fill-opacity="0.8" />
    <text y="24" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#eab308" letter-spacing="2">ELITE GOLD</text>
  </g>

  <!-- Right: Verification Status -->
  <text x="1020" y="670" text-anchor="end" font-family="'Courier New', monospace" font-size="13" fill="#64748b" letter-spacing="1">AUTHENTICITY</text>
  <text x="1020" y="695" text-anchor="end" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">OFFICIALLY RECORDED</text>
  <line x1="880" y1="710" x2="1020" y2="710" stroke="#334155" stroke-width="1" />
</svg>